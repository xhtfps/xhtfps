name: catalog-audit

on:
  schedule:
    # 每天 02:00 UTC（北京时间 10:00）跑一次
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'tools/build-index.ps1'
      - 'tools/build-db.py'
      - 'tools/link-check.py'
      - 'tools/health-check.ps1'
      - 'tools/catalog-rules.json'

permissions:
  contents: write

concurrency:
  group: catalog-audit
  cancel-in-progress: true

env:
  # 私有仓枚举需要用户身份令牌；仅靠 GITHUB_TOKEN（安装令牌）读不到 /user/repos
  CATALOG_TOKEN: ${{ secrets.CATALOG_TOKEN }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装依赖
        run: pip install requests

      - name: 探测凭据权限
        id: probe
        env:
          GH_TOKEN: ${{ env.CATALOG_TOKEN }}
        run: |
          if [ -n "$CATALOG_TOKEN" ] && gh api "/user/repos?per_page=1" >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "凭据可用，执行全量刷新。"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置可用的 CATALOG_TOKEN（需 repo 权限的 PAT），本次跳过全量刷新。"
          fi

      - name: 重新扫描仓库并刷新 catalog.json / README
        if: steps.probe.outputs.ok == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ env.CATALOG_TOKEN }}
        run: ./tools/build-index.ps1 -Owner xhtfps

      - name: 生成体检报告 HEALTH.md
        if: steps.probe.outputs.ok == 'true'
        shell: pwsh
        run: ./tools/health-check.ps1

      - name: 检查 README 引用（LINKS.md）
        if: steps.probe.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ env.CATALOG_TOKEN }}
        run: python tools/link-check.py

      - name: 重建查询库 embedded.db
        if: steps.probe.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ env.CATALOG_TOKEN }}
        run: python tools/build-db.py --owner xhtfps

      - name: 库自检（关键查询必须返回结果）
        if: steps.probe.outputs.ok == 'true'
        run: |
          python tools/db.py stats
          python tools/db.py driver ad9959 --json | head -20
          python - <<'PY'
          import sqlite3, sys
          con = sqlite3.connect('embedded.db')
          q = con.execute("select count(*) from pins where mcu_pin<>''").fetchone()[0]
          d = con.execute("select count(*) from drivers").fetchone()[0]
          print(f'pins with mcu_pin={q}, drivers={d}')
          sys.exit(0 if q > 0 and d > 0 else 1)
          PY

      - name: 有变化才提交
        if: steps.probe.outputs.ok == 'true'
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git add catalog.json README.md HEALTH.md LINKS.md links.json embedded.db
          git commit -m "自动刷新：catalog / README / HEALTH / LINKS / embedded.db（$(date -u '+%Y-%m-%d %H:%M UTC')）"
          git push
